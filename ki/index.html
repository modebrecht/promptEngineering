<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>KI clever nutzen</title>
<style>
  :root {
    --bg: #0f172a;
    --card: rgba(30, 41, 59, 0.72);
    --line: rgba(255, 255, 255, 0.1);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --soft: #cbd5e1;
    --ok: #10b981;
    --bad: #f43f5e;
    --gold: #fbbf24;
    --lc: #06b6d4;
    --lglow: rgba(6, 182, 212, 0.5);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at top right, #1e1b4b 0%, transparent 45%),
      radial-gradient(circle at bottom left, #083344 0%, transparent 45%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    padding: 28px 14px calc(110px + env(safe-area-inset-bottom));
  }
  body.modal-open { overflow: hidden; }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* Kopf */
  .hero { text-align: center; margin-bottom: 26px; }
  .hero-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: #1e293b; border: 1px solid #334155;
    display: inline-grid; place-items: center; color: #06b6d4;
  }
  .hero-icon svg { width: 34px; height: 34px; }
  h1 {
    font-size: clamp(2.3rem, 10vw, 3.6rem); line-height: 1.05;
    margin: 14px 0 10px; font-weight: 800; letter-spacing: -0.02em;
  }
  .grad {
    background: linear-gradient(90deg, #06b6d4, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); font-size: 1.1rem; margin: 0; }

  /* Level-Navigation */
  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 24px; }
  .pill {
    font-size: 0.92rem; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 1px solid #334155; background: #1e293b; color: var(--soft);
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  .pill svg { width: 14px; height: 14px; }
  .pill:active { transform: scale(0.96); }
  .pill.done svg { color: var(--ok); }
  .pill.locked { background: rgba(30, 41, 59, 0.4); color: #64748b; border-color: #273449; }
  .pill.active { background: var(--pc); color: #06121a; border-color: transparent; box-shadow: 0 0 16px var(--pg); }
  .pill.active svg { color: #06121a; }

  /* Karten */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px 18px; margin-bottom: 18px; position: relative; overflow: hidden;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .card-deco { position: absolute; top: 14px; right: 14px; color: var(--lc); opacity: 0.13; pointer-events: none; }
  .card-deco svg { width: 74px; height: 74px; }
  .level-head { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; padding-right: 60px; }
  .num {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-weight: 800; color: var(--lc); background: var(--lsoft);
  }
  h2 { font-size: 1.55rem; line-height: 1.2; margin: 0; }
  .tagline { color: var(--lc); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.82rem; margin: 6px 0 16px; }
  .learn p { margin: 0 0 12px; font-size: 1.07rem; color: #e2e8f0; }
  .learn strong { color: #fff; }

  /* Visuelle Beispiele */
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
  .chip { border-radius: 12px; padding: 10px 12px; background: rgba(15, 23, 42, 0.7); border: 1px solid #334155; border-top: 3px solid var(--cc); }
  .chip b { display: block; color: var(--cc); font-size: 1rem; }
  .chip span { color: var(--muted); font-size: 0.9rem; }
  @media (min-width: 620px) { .chips { grid-template-columns: repeat(4, 1fr); } }

  .compare { display: grid; gap: 10px; margin: 14px 0; }
  .ex { border-radius: 12px; padding: 12px 14px; background: rgba(15, 23, 42, 0.85); border-left: 4px solid #475569; }
  .ex.bad { border-left-color: var(--bad); }
  .ex.good { border-left-color: var(--ok); }
  .ex-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 4px; }
  .ex.bad .ex-label { color: #fb7185; }
  .ex.good .ex-label { color: #34d399; }
  .ex-label svg { width: 15px; height: 15px; }
  .ex p { margin: 0; }
  .hl { border-radius: 5px; padding: 0 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hl-was { background: rgba(6, 182, 212, 0.25); }
  .hl-wer { background: rgba(139, 92, 246, 0.3); }
  .hl-lang { background: rgba(234, 179, 8, 0.25); }
  .hl-form { background: rgba(16, 185, 129, 0.25); }

  .chat { display: grid; gap: 8px; margin: 14px 0; }
  .bubble { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 0.98rem; }
  .bubble small { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.75; margin-bottom: 2px; }
  .bubble.ki { background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
  .bubble.du { justify-self: end; background: rgba(139, 92, 246, 0.25); border: 1px solid rgba(139, 92, 246, 0.5); border-bottom-right-radius: 4px; }
  .bubble.ki.hard { color: var(--muted); }
  .bubble.ki.better { border-color: rgba(16, 185, 129, 0.55); }

  .phrases { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
  .phrase { font-size: 0.9rem; padding: 6px 10px; border-radius: 999px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4); }

  .steps { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; background: rgba(15, 23, 42, 0.7); border: 1px solid #334155; border-radius: 12px; padding: 10px 12px; }
  .steps .n { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; background: var(--lsoft); color: var(--lc); }

  .lights { display: grid; gap: 8px; margin: 14px 0; }
  @media (min-width: 620px) { .lights { grid-template-columns: repeat(3, 1fr); } }
  .light { border-radius: 12px; padding: 12px; background: rgba(15, 23, 42, 0.75); border: 1px solid #334155; border-top: 4px solid var(--cc); }
  .light b { display: flex; align-items: center; gap: 8px; color: var(--cc); }
  .light p { margin: 4px 0 0; font-size: 0.95rem; color: var(--soft); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--cc); box-shadow: 0 0 10px var(--cc); flex: 0 0 auto; }

  .arrow { color: var(--muted); justify-self: center; }
  .arrow svg { width: 22px; height: 22px; transform: rotate(90deg); }
  .mono { white-space: pre-line; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92rem; }

  /* Probier es aus */
  .try { margin-top: 16px; border-radius: 14px; border: 1px dashed rgba(255, 255, 255, 0.22); padding: 14px; background: rgba(15, 23, 42, 0.5); }
  .try-title { display: flex; align-items: center; gap: 8px; font-weight: 800; margin: 0 0 8px; color: #fff; }
  .try-title svg { width: 18px; height: 18px; color: var(--lc); }
  .prompt-box { position: relative; background: #0b1222; border-left: 4px solid var(--lc); border-radius: 0 10px 10px 0; padding: 12px 48px 12px 14px; white-space: pre-line; }
  .copy {
    position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid #334155; background: #1e293b; color: var(--soft); display: grid; place-items: center; cursor: pointer;
  }
  .copy svg { width: 18px; height: 18px; }
  .try-hint { margin: 8px 0 0; color: var(--muted); font-size: 0.92rem; }
  .try-hint.solo { margin-top: 0; color: var(--soft); font-size: 1rem; }
  .try-hint.note { margin-top: 4px; }
  .copyable { position: relative; padding-right: 54px; scroll-margin-top: 12px; }
  .bubble.copyable { padding-right: 52px; }
  .copyable > .copy { top: 8px; right: 8px; }
  button.phrase { font: inherit; font-size: 0.9rem; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.phrase svg { width: 14px; height: 14px; opacity: 0.75; flex: 0 0 auto; }
  button.phrase:active { transform: scale(0.97); }

  /* Quiz */
  .quiz { border-top: 4px solid var(--lc); }
  .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .quiz-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.2rem; margin: 0; }
  .quiz-title svg { width: 20px; height: 20px; color: var(--lc); }
  .hearts { display: flex; gap: 4px; }
  .heart { width: 26px; height: 26px; color: var(--bad); transition: transform 0.3s, opacity 0.3s, color 0.3s; }
  .heart.lost { color: #334155; }
  .heart.pop { animation: heartLoss 0.6s ease; }
  @keyframes heartLoss { 0% { transform: scale(1); } 30% { transform: scale(1.35) rotate(-10deg); } 60% { transform: scale(0.8) rotate(8deg); } 100% { transform: scale(1); } }
  .qprog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; margin: 0 0 14px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #334155; }
  .dots i.on { background: var(--lc); }
  .dots i.now { background: #fff; }
  .qtext { font-size: 1.15rem; font-weight: 700; margin: 0 0 10px; color: #fff; }
  .ctx { white-space: pre-line; background: rgba(15, 23, 42, 0.85); border-left: 4px solid #64748b; border-radius: 0 10px 10px 0; padding: 10px 12px; margin: 0 0 12px; color: #e2e8f0; }
  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    padding: 12px 14px; border-radius: 12px; border: 1px solid #475569; background: #334155; color: #e2e8f0;
    font-size: 1rem; line-height: 1.4; transition: transform 0.12s, background 0.2s, border-color 0.2s;
  }
  .opt:active { transform: scale(0.985); }
  .letter { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; opacity: 0.8; }
  .opt.wrong { background: rgba(244, 63, 94, 0.15); border-color: var(--bad); color: #fda4af; cursor: default; }
  .opt.right { background: rgba(16, 185, 129, 0.18); border-color: var(--ok); color: #6ee7b7; }
  .opt.dim { opacity: 0.35; cursor: default; }
  .opt.shake { animation: shake 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .fb, .btn-row, #quiz { scroll-margin-bottom: 104px; scroll-margin-top: 12px; }
  .fb { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 1rem; }
  .fb:empty { display: none; }
  .fb.ok { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; }
  .fb.no { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.4); color: #fecdd3; }
  .fb b { color: #fff; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 800; font-size: 1rem; color: #fff;
    background: linear-gradient(90deg, #0891b2, #7c3aed); box-shadow: 0 8px 24px -10px rgba(124, 58, 237, 0.8);
  }
  .btn svg { width: 18px; height: 18px; }
  .btn.ghost { background: #334155; box-shadow: none; border: 1px solid #475569; }
  .btn-row { display: flex; justify-content: flex-end; margin-top: 14px; }
  .done-box { text-align: center; padding: 8px 0 4px; }
  .done-box p { color: var(--soft); margin: 10px 0 16px; }

  /* Abzeichen */
  .medal {
    width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
    background: radial-gradient(circle at 35% 30%, #334155, #0f172a); border: 3px solid var(--mc); color: var(--mc);
    box-shadow: 0 0 26px var(--mg);
  }
  .medal svg { width: 44px; height: 44px; }
  .medal.sm { width: 56px; height: 56px; border-width: 2px; box-shadow: 0 0 14px var(--mg); }
  .medal.sm svg { width: 26px; height: 26px; }
  .medal.off { --mc: #475569; --mg: transparent; opacity: 0.5; }

  /* Inventar-Knopf */
  .inv-btn {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; cursor: pointer;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; border-radius: 18px;
    background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.7);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .inv-btn > svg { width: 30px; height: 30px; color: var(--gold); }
  .inv-btn small { display: block; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .inv-btn b { display: block; font-size: 1.05rem; text-align: left; }
  .inv-btn.bump { animation: bump 0.6s ease; }
  @keyframes bump { 40% { transform: scale(1.12); } }

  /* Modal */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgba(2, 6, 23, 0.78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .modal[hidden] { display: none; }
  .sheet {
    width: min(100%, 460px); max-height: calc(100vh - 36px); overflow: auto; text-align: center;
    background: #111a2e; border: 1px solid #334155; border-radius: 22px; padding: 26px 20px 22px;
    animation: sheetIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  @keyframes sheetIn { from { transform: translateY(24px) scale(0.96); opacity: 0; } }
  .sheet h3 { font-size: 1.6rem; margin: 16px 0 6px; }
  .sheet p { color: var(--soft); margin: 0 0 18px; }
  .sheet .btn { width: 100%; }
  .sheet .btn + .btn { margin-top: 10px; }
  .pop { animation: medalPop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
  @keyframes medalPop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1); } }
  .eyebrow { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
  .grid-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
  .grid-badges div { display: grid; gap: 6px; justify-items: center; font-size: 0.78rem; font-weight: 700; color: var(--soft); }
  .reset { background: none; border: 0; color: #64748b; font-size: 0.85rem; text-decoration: underline; cursor: pointer; margin-top: 14px; }
  .reset.armed { color: var(--bad); }

  /* Abschluss */
  .cert { text-align: center; border: 2px solid rgba(251, 191, 36, 0.45); background: linear-gradient(160deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9)); }
  .cert .trophy { color: var(--gold); width: 72px; height: 72px; margin: 4px auto 0; filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.6)); }
  .cert h2 { font-size: 1.9rem; margin: 10px 0 4px; }
  .cert .who { font-size: 1.35rem; font-weight: 800; color: #fff; margin: 14px 0 4px; min-height: 1.6em; }
  .cert .what { color: var(--soft); margin: 0 0 6px; }
  .cert .date { color: var(--muted); font-size: 0.9rem; }
  .cert-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0 6px; }
  .name-field { display: grid; gap: 6px; text-align: left; font-weight: 700; margin-bottom: 14px; }
  .name-field input { font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 12px; border: 1px solid #475569; background: #0b1222; color: #fff; }
  .note { color: var(--muted); font-size: 0.95rem; text-align: center; }

  /* Sammelkarte */
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .bscene { position: relative; width: 210px; height: 292px; margin: 6px auto 4px; perspective: 900px; }
  .brays {
    position: absolute; left: 50%; top: 50%; width: 480px; height: 480px; margin: -240px 0 0 -240px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, var(--mg) 0deg 5deg, transparent 5deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 16%, transparent 60%); mask: radial-gradient(circle, #000 16%, transparent 60%);
    opacity: 0.6; pointer-events: none; animation: spin 20s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bfloat { width: 100%; height: 100%; transform-style: preserve-3d; animation: sway 5.5s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: translateY(0) rotateY(-8deg) rotateX(3deg); } 50% { transform: translateY(-8px) rotateY(8deg) rotateX(-3deg); } }
  .bcard {
    --rx: 0deg; --ry: 0deg; --flip: 0deg; --px: 50%; --py: 50%;
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d; cursor: pointer; outline: none;
    transform: rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip)));
    transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .bcard.flipped { --flip: 180deg; }
  .bcard:focus-visible .bfront, .bcard:focus-visible .bback { outline: 3px solid #67e8f9; outline-offset: 3px; }
  .bscene.reveal .bcard { animation: reveal 1.9s cubic-bezier(0.15, 0.75, 0.25, 1) both; }
  .bscene.live .bcard { animation: none; }
  @keyframes reveal {
    0% { transform: translateY(70px) scale(0.3) rotateY(180deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translateY(0) scale(1) rotateY(720deg); opacity: 1; }
  }
  .bface {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border: 3px solid transparent;
    box-shadow: 0 0 34px var(--mg), 0 22px 40px -12px rgba(0, 0, 0, 0.8);
  }
  .bfront {
    display: flex; flex-direction: column; align-items: center; padding: 12px 12px 14px; text-align: center;
    background:
      radial-gradient(120% 70% at 50% 0%, var(--mg) 0%, transparent 60%) padding-box,
      linear-gradient(165deg, #1e293b, #0a1020) padding-box,
      conic-gradient(from var(--ang), var(--mc), #fde68a, #ffffff, var(--mc), #fbbf24, var(--mc)) border-box;
    animation: ang 4s linear infinite;
  }
  @keyframes ang { to { --ang: 360deg; } }
  .btop { width: 100%; display: flex; justify-content: space-between; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #fde68a; }
  .bmedal {
    width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; margin: 22px 0 14px; color: var(--mc);
    background: radial-gradient(circle at 35% 30%, #3b4a63, #0b1222 70%); border: 3px solid var(--mc);
    box-shadow: 0 0 0 5px rgba(251, 191, 36, 0.28), 0 0 30px var(--mg), inset 0 0 18px rgba(0, 0, 0, 0.6);
  }
  .bmedal svg { width: 50px; height: 50px; filter: drop-shadow(0 0 8px var(--mg)); }
  .bname { font-size: 1.3rem; font-weight: 800; color: #fff; margin: 0; line-height: 1.2; }
  .blevel { font-size: 0.8rem; color: var(--muted); margin: 3px 0 0; }
  .bstars { display: flex; gap: 4px; margin-top: auto; }
  .star { width: 24px; height: 24px; color: #334155; }
  .star.on { color: var(--gold); filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.8)); }
  .bholo {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0.55;
    background: linear-gradient(125deg, transparent 20%, rgba(255, 0, 170, 0.22) 34%, rgba(0, 229, 255, 0.22) 48%, rgba(255, 230, 0, 0.22) 62%, transparent 78%);
    background-size: 260% 260%; background-position: var(--px) var(--py); transition: background-position 0.2s;
  }
  .bshine {
    position: absolute; top: -50%; bottom: -50%; left: -50%; width: 200%; pointer-events: none;
    background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.5) 50%, transparent 58%);
    transform: translateX(-75%); animation: shine 3.4s ease-in-out 1.8s infinite;
  }
  @keyframes shine { 0% { transform: translateX(-75%); } 40%, 100% { transform: translateX(75%); } }
  .bback {
    transform: rotateY(180deg); display: grid; place-items: center;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.045) 0 10px, transparent 10px 20px) padding-box,
      radial-gradient(circle at 50% 45%, var(--mg), transparent 65%) padding-box,
      linear-gradient(160deg, #1e1b4b, #0a1020) padding-box,

  .bbackin { display: grid; justify-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 1.25rem; line-height: 1.1; text-align: center; }

  .award-title { font-size: 1.5rem; margin: 26px 0 4px; }

  /* Mini-Karten */

  /* Runden */
  .rounds { display: flex; justify-content: center; gap: 6px; margin: 0 auto 12px; padding: 4px; border-radius: 16px; background: rgba(15, 23, 42, 0.7); border: 1px solid #273449; width: max-content; max-width: 100%; }
  .round { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; font-weight: 800; font-size: 0.95rem; padding: 9px 16px; border-radius: 12px; color: var(--soft); }

  /* Serie 2: silber-violetter Rahmen */

      radial-gradient(120% 70% at 50% 0%, var(--mg) 0%, transparent 60%) padding-box,

      conic-gradient(from var(--ang), var(--mc), #c4b5fd, #ffffff, #67e8f9, var(--mc), #f0abfc, var(--mc)) border-box;
  }

    background:
      repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 0 8px, transparent 8px 16px) padding-box,
      radial-gradient(circle at 50% 45%, var(--mg), transparent 65%) padding-box,
      linear-gradient(160deg, #3b0764, #0a1020) padding-box,

  }

  .s2 .bmedal { box-shadow: 0 0 0 5px rgba(196, 181, 253, 0.35), 0 0 30px var(--mg), inset 0 0 18px rgba(0, 0, 0, 0.6); }
  .s2 .bholo { opacity: 0.8; }
  .bbackin small { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .mini.s2 { background: linear-gradient(165deg, #241b4b, #0a1020) padding-box, linear-gradient(135deg, var(--mc), #c4b5fd, #e0f2fe, var(--mc)) border-box; }
  .minis { grid-template-columns: repeat(var(--cols, 3), 1fr); }

  /* Prompt-Baukasten */

  .spot { margin: 14px 0; }

  .fbranch { display: grid; justify-items: center; gap: 6px; }
  .fyes, .fno { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 0.85rem; }
  .fyes { color: #34d399; } .fno { color: #fb7185; }
  .fyes svg, .fno svg { width: 14px; height: 14px; }
  .fnode.ok { border-color: #10b981; background: rgba(16, 185, 129, 0.12); }
  .fnode.no { border-color: #f43f5e; background: rgba(244, 63, 94, 0.1); }

  /* Konfetti & Toast */
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.7; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 70; transform: translate(-50%, 20px);
    background: #f1f5f9; color: #0f172a; font-weight: 700; padding: 10px 16px; border-radius: 999px; opacity: 0;
    transition: opacity 0.25s, transform 0.25s; pointer-events: none; max-width: calc(100% - 28px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  :focus-visible { outline: 3px solid #67e8f9; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

LEVELS.forEach((l) => { if (!l.round) l.round = 1; });
const byId = (id) => LEVELS.find((l) => l.id === id);
const inRound = (r) => LEVELS.filter((l) => l.round === r);
const posInRound = (lvl) => inRound(lvl.round).indexOf(lvl) + 1;
const CORE = inRound(1).length;
const HEARTS = 3;

/* ---------- Speicher ---------- */
const KEY = "ki-clever-nutzen-v1";
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    const done = Array.isArray(s.done) ? s.done.filter((n) => LEVELS.some((l) => l.id === n)) : [];
    const best = {};
    for (const id of done) {
      const v = s.best && Number(s.best[id]);
      best[id] = v >= 1 && v <= HEARTS ? v : 1;
    }
    return { done, best, name: typeof s.name === "string" ? s.name.slice(0, 40) : "" };
  } catch { return { done: [], best: {}, name: "" }; }
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* Speichern nicht möglich */ } }

const isDone = (id) => state.done.includes(id);
const doneIn = (r) => inRound(r).filter((l) => isDone(l.id)).length;
const coreDone = () => doneIn(1);
const r1Complete = () => coreDone() === CORE;
function unlocked(id) {
  if (id === "abschluss") return r1Complete();
  const lvl = byId(id);
  if (!lvl) return false;
  if (lvl.round === 2 && !r1Complete()) return false;
  const list = inRound(lvl.round);
  const i = list.indexOf(lvl);
  return i === 0 || isDone(list[i - 1].id);
}
const firstOpen = (r) => inRound(r).find((l) => !isDone(l.id)) || inRound(r)[0];

/* ---------- Hilfen ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
function medal(lvl, cls = "") {
  return `<div class="medal ${cls}" style="--mc:${lvl.color};--mg:${lvl.glow}">${ICONS[lvl.icon]}</div>`;
}
function starsHtml(n) {
  let s = "";
  for (let i = 0; i < HEARTS; i++) s += `<span class="star${i < n ? " on" : ""}">${ICONS.star}</span>`;
  return s;
}
const SPARK_POS = [[4, 8], [88, 4], [96, 42], [2, 52], [92, 78], [6, 84], [50, -2]];
function badgeCard(lvl, reveal) {
  const best = state.best[lvl.id] || 1;
  const no = String(posInRound(lvl)).padStart(2, "0") + " / " + String(inRound(lvl.round).length).padStart(2, "0");
  const sparks = SPARK_POS.map(([x, y], i) =>
    `<span class="spark" style="left:${x}%;top:${y}%;animation-delay:${(i * 0.37).toFixed(2)}s">${ICONS.spark}</span>`).join("");
  return `
    <div class="bscene${reveal ? " reveal" : ""}${lvl.round === 2 ? " s2" : ""}" style="--mc:${lvl.color};--mg:${lvl.glow}">

      <div class="bfloat">
        <div class="bcard" tabindex="0" role="button" aria-label="Abzeichen ${esc(lvl.badge)}, ${best} von ${HEARTS} Sternen. Tippen zum Umdrehen.">
          <div class="bface bfront">
            <div class="bholo"></div>

            <div class="bshine"></div>
          </div>
          <div class="bface bback"><div class="bbackin">${ICONS.robot}<span>KI clever<br>nutzen</span><small>Serie ${lvl.round}</small></div></div>
        </div>
      </div>
      <div class="bsparks" aria-hidden="true">${sparks}</div>
    </div>`;
}
function attachCard(root) {
  const scene = root.querySelector(".bscene");
  if (!scene) return;
  const card = scene.querySelector(".bcard");
  const goLive = () => {
    card.style.transition = "none";
    scene.classList.add("live");
    void card.offsetWidth;
    card.style.transition = "";
  };
  if (scene.classList.contains("reveal") && !reduced.matches) card.addEventListener("animationend", (e) => { if (e.target === card) goLive(); }, { once: false });
  else goLive();
  scene.addEventListener("pointermove", (e) => {
    if (!scene.classList.contains("live")) return;
    const r = card.getBoundingClientRect();
    const x = Math.max(-0.5, Math.min(0.5, (e.clientX - r.left) / r.width - 0.5));
    const y = Math.max(-0.5, Math.min(0.5, (e.clientY - r.top) / r.height - 0.5));
    card.style.setProperty("--ry", (x * 26).toFixed(1) + "deg");
    card.style.setProperty("--rx", (-y * 20).toFixed(1) + "deg");
    card.style.setProperty("--px", (x * 100 + 50).toFixed(0) + "%");
    card.style.setProperty("--py", (y * 100 + 50).toFixed(0) + "%");
  });
  scene.addEventListener("pointerleave", () => {
    card.style.setProperty("--ry", "0deg");
    card.style.setProperty("--rx", "0deg");
  });
  const flip = () => { if (scene.classList.contains("live")) card.classList.toggle("flipped"); };
  card.addEventListener("click", flip);
  card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
}
function miniCard(lvl, i = 0) {
  if (!isDone(lvl.id)) {
    return `<div class="mini off" aria-label="Level ${posInRound(lvl)} noch nicht geschafft">${ICONS.lock}<span class="mname">Level ${posInRound(lvl)}</span></div>`;
  }
  return `<button type="button" class="mini${lvl.round === 2 ? " s2" : ""}" data-card="${lvl.id}" style="--mc:${lvl.color};--mg:${lvl.glow};--d:${(i * 0.6).toFixed(1)}s" aria-label="Karte ${esc(lvl.badge)} ansehen">
      ${ICONS[lvl.icon]}<span class="mname">${esc(lvl.badge)}</span><span class="mstars">${starsHtml(state.best[lvl.id] || 1)}</span></button>`;
}
function openCardView(lvl, backToInventory) {
  openModal(`
    ${badgeCard(lvl, true)}
    <h3 id="sheet-title" class="award-title">${esc(lvl.badge)}</h3>
    <p class="card-hint">Tippe auf die Karte, um sie umzudrehen.</p>
    <button class="btn" type="button" id="card-back">${backToInventory ? "Zurück zu den Abzeichen" : "Schliessen"}</button>`);
  $("card-back").addEventListener("click", () => { if (backToInventory) openInventory(); else closeModal(); });
}

function confetti() {
  if (reduced.matches) return;
  const colors = ["#06b6d4", "#8b5cf6", "#fbbf24", "#10b981", "#f43f5e", "#f8fafc"];
  for (let i = 0; i < 46; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
    c.style.animationDelay = Math.random() * 0.3 + "s";
    c.addEventListener("animationend", () => c.remove());
    document.body.append(c);
  }
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch { /* nichts */ }
    ta.remove();
  }
  toast("Kopiert! Jetzt in die KI einfügen.");
}

/* ---------- Navigation ---------- */
let current = 1;
let viewRound = 1;
function setAccent(lvl) {
  const r = document.documentElement.style;
  r.setProperty("--lc", lvl.color);
  r.setProperty("--lglow", lvl.glow);
  r.setProperty("--lsoft", lvl.soft);
}
function renderNav() {
  const rounds = $("rounds");
  rounds.innerHTML = "";
  for (const r of [1, 2]) {
    const b = document.createElement("button");
    b.type = "button";
    const open = r === 1 || r1Complete();
    const complete = doneIn(r) === inRound(r).length;
    b.className = "round" + (viewRound === r ? " active" : "") + (open ? "" : " locked") + (r === 2 ? " r2" : "");
    b.innerHTML = (open ? (complete ? ICONS.check : "") : ICONS.lock) + `<span>Runde ${r}</span><small>${doneIn(r)}/${inRound(r).length}</small>`;
    b.setAttribute("aria-pressed", String(viewRound === r));
    b.addEventListener("click", () => {
      if (!open) { toast("Schliesse zuerst Runde 1 ab."); return; }
      go(firstOpen(r).id, true);
    });
    rounds.append(b);
  }
  const nav = $("levels");
  nav.innerHTML = "";
  const items = inRound(viewRound).map((l) => ({ id: l.id, label: `${posInRound(l)}. ${l.short}`, color: l.color, glow: l.glow, lvl: l }));
  items.push({ id: "abschluss", label: "Abschluss", color: "#fbbf24", glow: "rgba(251,191,36,.55)" });
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button";
    const open = unlocked(it.id);
    const done = it.id !== "abschluss" && isDone(it.id);
    b.className = "pill" + (current === it.id ? " active" : "") + (open ? "" : " locked") + (done ? " done" : "");
    b.style.setProperty("--pc", it.color);
    b.style.setProperty("--pg", it.glow);
    b.innerHTML = (open ? (done ? ICONS.check : "") : ICONS.lock) + `<span>${esc(it.label)}</span>`;
    if (!open) b.setAttribute("aria-disabled", "true");
    if (current === it.id) b.setAttribute("aria-current", "page");
    b.addEventListener("click", () => {
      if (!open) {
        if (it.id === "abschluss" || it.lvl.round === 2 && !r1Complete()) toast(`Löse zuerst alle ${CORE} Levels von Runde 1.`);
        else toast(`Löse zuerst Level ${posInRound(it.lvl) - 1}.`);
        return;
      }
      go(it.id, true);
    });
    nav.append(b);
  }
}
function updateInventory() {
  $("inv-count").textContent = r1Complete() ? `${state.done.length}/${LEVELS.length}` : `${coreDone()}/${CORE}`;
}
function go(id, scroll) {
  current = id;
  if (id !== "abschluss") viewRound = byId(id).round;
  if (history.replaceState) history.replaceState(null, "", "#" + (id === "abschluss" ? "abschluss" : "level-" + id));
  renderNav();
  if (id === "abschluss") renderFinish(); else renderLevel(byId(id));
  if (scroll) $("rounds").scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" });
}

/* ---------- Level ---------- */

function renderLevel(lvl) {
  setAccent(lvl);
  const stage = $("stage");
  const pos = posInRound(lvl);
  stage.innerHTML = `
    <article class="card${lvl.round === 2 ? " r2card" : ""}" id="level-card" aria-labelledby="level-title">
      <div class="card-deco" aria-hidden="true">${ICONS[lvl.icon]}</div>
      <p class="where">Runde ${lvl.round} · Level ${pos} von ${inRound(lvl.round).length}</p>
      <div class="stepper" aria-label="So gehst du vor">
        <button type="button" class="step" data-jump="level-card"><b>1</b>Lesen</button><span class="step-sep" aria-hidden="true">›</span>
        <button type="button" class="step" data-jump="try-box"><b>2</b>Probieren</button><span class="step-sep" aria-hidden="true">›</span>
        <button type="button" class="step" data-jump="quiz"><b>3</b>Quiz</button>
      </div>
      <div class="level-head"><span class="num">${pos}</span><h2 id="level-title" tabindex="-1">${esc(lvl.title)}</h2></div>
      <p class="tagline">${esc(lvl.tagline)}</p>
      <div class="learn">${lvl.learn.map((p) => `<p>${p}</p>`).join("")}</div>
      ${lvl.visual}
      <div class="try" id="try-box">
        <p class="try-title">${ICONS.play} Probier es aus</p>
        ${lvl.tryit.prompt ? `<div class="prompt-box"><span id="try-text">${esc(lvl.tryit.prompt)}</span><button class="copy" type="button" id="copy-btn" aria-label="Prompt kopieren">${ICONS.copy}</button></div>` : ""}
        <p class="try-hint${lvl.tryit.prompt ? "" : " solo"}">${esc(lvl.tryit.hint)}</p>
        <p class="try-hint note">Nur mit einer KI, die eure Schule erlaubt. Keine KI da? Dann geh direkt zum Quiz.</p>
      </div>
    </article>
    <section class="card quiz" id="quiz" aria-labelledby="quiz-title"></section>`;
  if ($("copy-btn")) $("copy-btn").addEventListener("click", () => copyText($("try-text").textContent));
  /* Prompts in den Beispielen: direkt dort kopieren statt ein zweites Mal im Probier-Feld */
  stage.querySelectorAll("[data-copy]").forEach((el) => {
    if (el.tagName === "BUTTON") {
      el.insertAdjacentHTML("beforeend", ICONS.copy);
      el.addEventListener("click", () => copyText(el.dataset.copy));
      return;
    }
    el.classList.add("copyable");
    const b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.setAttribute("aria-label", "Prompt kopieren"); b.innerHTML = ICONS.copy;
    b.addEventListener("click", () => copyText(el.dataset.copy));
    el.append(b);
  });
  const firstCopy = !lvl.tryit.prompt && stage.querySelector(".copyable");
  if (firstCopy) {
    firstCopy.id = "try-first";
    stage.querySelector('[data-jump="try-box"]').dataset.jump = "try-first";
  }
  if (lvl.builder) setupBuilder(lvl);
  if (lvl.setup) lvl.setup();
  stage.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
    $(b.dataset.jump).scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" });
  }));
  if (isDone(lvl.id)) renderDoneBox(lvl); else startQuiz(lvl, false);
}

/* Ton-Umschalter (Level «Den richtigen Ton treffen») */
const TONES = [
  { label: "Klassenchat", icon: "💬", forText: "für den Klassenchat", ton: "locker",
    msg: "Hey Leute! 🏃 <mark>Dienstag</mark> ist Sporttag, Start <mark>8.15 Uhr</mark>. <mark>Turnschuhe</mark> nicht vergessen! 👟" },
  { label: "Grosi", icon: "👵", forText: "für mein Grosi", ton: "herzlich",
    msg: "Liebes Grosi ❤️ Am <mark>Dienstag</mark> haben wir Sporttag! Es geht um <mark>8.15 Uhr</mark> los. Ich nehme meine <mark>Turnschuhe</mark> mit. Liebe Grüsse" },
  { label: "Eltern", icon: "📄", forText: "für einen Brief an die Eltern", ton: "höflich",
    msg: "Guten Tag. Am <mark>Dienstag</mark> findet der Sporttag statt. Beginn ist um <mark>8.15 Uhr</mark>. Bitte geben Sie Ihrem Kind <mark>Turnschuhe</mark> mit." }
];
function setupTone() {
  const box = $("tone");
  box.innerHTML = `
    <div class="tone-tabs" role="group" aria-label="Für wen ist die Nachricht?">
      ${TONES.map((t, i) => `<button type="button" class="ttab" data-t="${i}"><span aria-hidden="true" style="font-size:1.3rem">${t.icon}</span>${esc(t.label)}</button>`).join("")}
    </div>
    <p class="tone-prompt" id="tone-prompt"></p>
    <div class="tone-msg" id="tone-msg" aria-live="polite"></div>
    <p class="tone-note">Gleiche Infos, anderer Ton: <mark>Dienstag</mark> <mark>8.15 Uhr</mark> <mark>Turnschuhe</mark></p>`;
  function show(i) {
    const t = TONES[i];
    box.querySelectorAll(".ttab").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.t) === i)));
    $("tone-prompt").innerHTML = `Prompt: «Schreib die Infos zum Sporttag <b>${esc(t.forText)}</b>. Ton: <b>${esc(t.ton)}</b>.»`;
    const m = $("tone-msg");
    m.innerHTML = `<small>${esc(t.label)} · ${esc(t.ton)}</small>${t.msg}`;
    m.classList.remove("swap"); void m.offsetWidth; m.classList.add("swap");
  }
  box.querySelectorAll(".ttab").forEach((b) => b.addEventListener("click", () => show(Number(b.dataset.t))));
  show(0);
}

/* Fehlersuchbild (Level «Echt oder KI?») */
const SPOTS = ["Buchstabensalat auf dem Schild", "Hand mit 6 Fingern", "Velo mit 3 Rädern"];
function setupSpot() {
  const found = new Set();
  const svg = $("spot-svg");
  function mark(i) {
    if (found.has(i)) return;
    found.add(i);
    svg.querySelector(`.hot[data-spot="${i}"]`).classList.add("found");
    $("spot-count").textContent = `Gefunden: ${found.size} von ${SPOTS.length}`;
    $("spot-list").innerHTML = [...found].map((n) => `<li>${ICONS.check}<span>${esc(SPOTS[n])}</span></li>`).join("");
    if (found.size === SPOTS.length) {
      $("spot-msg").innerHTML = "<b>Alle gefunden!</b> Solche Fehler verraten KI-Bilder. Aber gute Fälschungen haben sie nicht – darum prüfst du die Quelle.";
      $("spot-help").hidden = true;
    } else {
      $("spot-msg").textContent = "Gut gesehen! Such weiter.";
    }
  }
  svg.querySelectorAll(".hot").forEach((h) => h.addEventListener("click", (e) => { e.stopPropagation(); mark(Number(h.dataset.spot)); }));
  svg.addEventListener("click", () => { if (found.size < SPOTS.length) $("spot-msg").textContent = "Da ist alles normal. Schau genau hin: Schrift, Hände, Dinge im Hintergrund."; });
  $("spot-help").addEventListener("click", () => SPOTS.forEach((_, i) => mark(i)));
}

/* Prompt-Baukasten (Level «Bilder beschreiben») */
const builderSel = {};
function setupBuilder(lvl) {
  const box = $("builder");
  for (const part of lvl.builder) if (!(part.key in builderSel)) builderSel[part.key] = 0;
  const get = (key) => lvl.builder.find((p) => p.key === key).options[builderSel[key]];
  function update() {
    const [wer, werEmoji] = get("wer");
    const [tut, tutEmoji] = get("tut");
    const [wo, woKey] = get("wo");
    const [stil, stilKey] = get("stil");
    $("try-text").textContent = `Erstelle ein Bild: ${wer} ${tut} ${wo}. Stil: ${stil}.`;
    const sk = $("sketch");
    sk.className = `sketch wo-${woKey} stil-${stilKey}`;
    const place = { space: "🪐", kitchen: "🍳", mountain: "🏔️" }[woKey];
    sk.innerHTML = `<span class="sk-bg">${place}</span><span class="sk-main">${werEmoji}</span><span class="sk-act">${tutEmoji}</span>`;
    box.querySelectorAll(".bchip").forEach((c) => c.setAttribute("aria-pressed", String(builderSel[c.dataset.key] === Number(c.dataset.i))));
  }
  box.innerHTML = lvl.builder.map((part) => `
    <div class="bpart" role="group" aria-label="${esc(part.label)}">
      <span class="bplabel">${esc(part.label)}</span>
      <div class="bchips">${part.options.map((o, i) => `<button type="button" class="bchip" data-key="${part.key}" data-i="${i}">${esc(o[0])}</button>`).join("")}</div>
    </div>`).join("") + `<figure class="sketch-wrap"><div id="sketch" aria-hidden="true"></div><figcaption>Nur eine Skizze – das echte Bild malt die Bild-KI.</figcaption></figure>`;
  box.querySelectorAll(".bchip").forEach((c) => c.addEventListener("click", () => {
    builderSel[c.dataset.key] = Number(c.dataset.i);
    update();
  }));
  update();
}

function renderDoneBox(lvl) {
  run = null;
  const best = state.best[lvl.id] || 1;
  $("quiz").innerHTML = `
    <div class="done-box">
      ${miniCard(lvl)}
      <h3 id="quiz-title" style="margin:14px 0 0;font-size:1.3rem">Level geschafft!</h3>
      <p>${best < HEARTS ? `Du hast ${best} von ${HEARTS} Sternen. Übe nochmals ohne Fehler, dann bekommt deine Karte alle Sterne.` : "Volle Sterne! Tippe auf die Karte, um sie anzusehen."}</p>
      <button class="btn ghost" type="button" id="practice">${ICONS.redo} ${best < HEARTS ? "Mehr Sterne holen" : "Nochmals üben"}</button>
    </div>`;
  $("quiz").querySelector("[data-card]").addEventListener("click", () => openCardView(lvl, false));
  $("practice").addEventListener("click", () => startQuiz(lvl, true));
}

function startQuiz(lvl, practice) {
  run = { lvl, practice, qi: 0, hearts: HEARTS, order: lvl.questions.map((q) => (q.fixed ? q.options.slice() : shuffle(q.options))), answered: false };
  renderQuestion(false);
}

function heartsHtml() {
  let h = "";
  for (let i = 0; i < HEARTS; i++) h += `<span class="heart${i < run.hearts ? "" : " lost"}" data-h="${i}">${ICONS.heart}</span>`;
  return h;
}

function renderQuestion(focus) {
  const { lvl, qi } = run;
  const q = lvl.questions[qi];
  const total = lvl.questions.length;
  let dots = "";
  for (let i = 0; i < total; i++) dots += `<i class="${i < qi ? "on" : i === qi ? "now" : ""}"></i>`;
  $("quiz").innerHTML = `
    <div class="quiz-top">
      <h3 class="quiz-title" id="quiz-title">${ICONS.quiz} Quiz${run.practice ? " (Übung)" : ""}</h3>
      <div class="hearts" id="hearts" role="img" aria-label="${run.hearts} von ${HEARTS} Herzen">${heartsHtml()}</div>
    </div>
    <div class="qprog"><span>Frage ${qi + 1} von ${total}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <p class="qtext" id="qtext" tabindex="-1">${esc(q.q)}</p>
    ${q.ctx ? `<p class="ctx">${esc(q.ctx)}</p>` : ""}
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="btn-row" id="next-row" hidden></div>`;
  const opts = $("opts");
  run.answered = false;
  run.order[qi].forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.innerHTML = `<span class="letter">${"ABC"[i]}</span><span>${esc(o.t)}</span>${o.dot ? `<span class="dot" style="--cc:${o.dot};margin-left:auto"></span>` : ""}`;
    b.addEventListener("click", () => answer(b, o));
    opts.append(b);
  });
  if (focus) $("qtext").focus({ preventScroll: true });
}

function answer(btn, opt) {
  if (run.answered || btn.classList.contains("wrong")) return;
  const fb = $("fb");
  if (opt.ok) {
    run.answered = true;
    btn.classList.add("right");
    btn.querySelector(".letter").innerHTML = ICONS.check;
    $("opts").querySelectorAll(".opt").forEach((b) => { if (b !== btn) b.classList.add("dim"); b.setAttribute("aria-disabled", "true"); });
    fb.className = "fb ok";
    fb.innerHTML = `<b>Richtig!</b> ${esc(opt.why)}`;
    const last = run.qi === run.lvl.questions.length - 1;
    const row = $("next-row");
    row.hidden = false;
    row.innerHTML = `<button class="btn" type="button" id="next">${last ? "Level abschliessen" : "Weiter"} ${ICONS.arrow}</button>`;
    $("next").addEventListener("click", () => {
      if (last) finishLevel();
      else { run.qi++; renderQuestion(true); $("quiz").scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" }); }
    });
    row.scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "nearest" });
  } else {
    run.hearts--;
    btn.classList.add("wrong", "shake");
    btn.setAttribute("aria-disabled", "true");
    btn.querySelector(".letter").innerHTML = ICONS.x;
    const heart = document.querySelector(`.heart[data-h="${run.hearts}"]`);
    if (heart) { heart.classList.add("lost", "pop"); }
    $("hearts").setAttribute("aria-label", `${run.hearts} von ${HEARTS} Herzen`);
    fb.className = "fb no";
    fb.innerHTML = run.hearts > 0
      ? `<b>Nicht ganz.</b> ${esc(opt.why)} Versuch es nochmals.`
      : `<b>Nicht ganz.</b> ${esc(opt.why)}`;
    fb.scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "nearest" });
    if (run.hearts <= 0) {
      run.answered = true;
      setTimeout(showFail, 1400);
    }
  }
}

function finishLevel() {
  const lvl = run.lvl;
  const earned = run.hearts;
  if (run.practice || isDone(lvl.id)) {
    const old = state.best[lvl.id] || 1;
    if (earned > old) {
      state.best[lvl.id] = earned;
      save();
      renderDoneBox(lvl);
      confetti();
      openModal(`
        ${badgeCard(lvl, true)}
        <h3 id="sheet-title" class="award-title">Neuer Rekord!</h3>
        <p>Deine Karte hat jetzt ${earned} von ${HEARTS} Sternen.</p>
        <button class="btn" type="button" id="card-back">Super!</button>`);
      $("card-back").addEventListener("click", closeModal);
    } else {
      toast("Gut geübt!");
      renderDoneBox(lvl);
    }
    return;
  }
  state.done.push(lvl.id);
  state.best[lvl.id] = earned;
  save();
  updateInventory();
  const inv = $("inv-btn");
  inv.classList.remove("bump"); void inv.offsetWidth; inv.classList.add("bump");
  renderNav();
  renderDoneBox(lvl);
  confetti();
  const list = inRound(lvl.round);
  const pos = posInRound(lvl);
  const next = list.find((l) => !isDone(l.id));
  const roundComplete = !next;
  let actions, msg;
  if (roundComplete && lvl.round === 1) {
    const r2 = firstOpen(2);
    msg = `Stark! Du hast Runde 1 geschafft. <b>Runde 2 ist jetzt offen</b> – mit einer neuen Kartenserie.`;
    actions = `<button class="btn" type="button" data-go="${r2.id}">Runde 2 starten ${ICONS.arrow}</button>
               <button class="btn ghost" type="button" data-go="abschluss">${ICONS.trophy} Zur Urkunde</button>`;
  } else if (roundComplete) {
    msg = `Wow! Du hast alle ${LEVELS.length} Karten gesammelt.`;
    actions = `<button class="btn" type="button" data-go="abschluss">${ICONS.trophy} Zur Urkunde</button>`;
  } else {
    msg = `Level ${pos} geschafft. Level ${posInRound(next)} ist jetzt offen.`;
    actions = `<button class="btn" type="button" data-go="${next.id}">Weiter zu Level ${posInRound(next)} ${ICONS.arrow}</button>`;
  }
  const starText = earned === HEARTS ? "Ohne Fehler – alle 3 Sterne!" : `${earned} von ${HEARTS} Sternen. Mit «Mehr Sterne holen» kannst du sie später füllen.`;
  openModal(`
    ${badgeCard(lvl, true)}
    <h3 id="sheet-title" class="award-title">Abzeichen verdient!</h3>
    <p>${msg}<br><span style="color:var(--gold)">${starText}</span></p>
    ${actions}`);
}

function showFail() {
  const lvl = run.lvl;
  openModal(`
    <div style="color:var(--bad);width:84px;height:84px;margin:0 auto" class="pop">${ICONS.broken}</div>
    <h3 id="sheet-title">Keine Herzen mehr</h3>
    <p>Kein Problem. Lies den Text oben nochmals genau. Dann startest du das Level neu.</p>
    <button class="btn" type="button" id="restart">${ICONS.redo} Level neu starten</button>`);
  $("restart").addEventListener("click", () => {
    closeModal();
    startQuiz(lvl, run.practice);
    $("level-card").scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" });
    $("level-title").focus({ preventScroll: true });
  });
}

/* ---------- Abschluss ---------- */
function renderFinish() {
  document.documentElement.style.setProperty("--lc", "#fbbf24");
  const date = new Intl.DateTimeFormat("de-CH", { day: "numeric", month: "long", year: "numeric" }).format(new Date());
  const badges = LEVELS.filter((l) => isDone(l.id)).map((l, i) => miniCard(l, i)).join("");
  const r2 = doneIn(2), r2n = inRound(2).length;
  const extra = r2 === r2n ? " – und Runde 2 komplett" : r2 > 0 ? ` – und ${r2} von ${r2n} Levels aus Runde 2` : "";
  $("stage").innerHTML = `
    <section class="card">
      <label class="name-field" for="name">Dein Vorname
        <input id="name" type="text" maxlength="40" autocomplete="given-name" value="${esc(state.name)}" placeholder="z. B. Lea">
      </label>
      <p class="note" style="margin:0">Dein Name bleibt nur auf diesem Gerät.</p>
    </section>
    <section class="card cert" aria-labelledby="cert-title">
      <div class="trophy">${ICONS.trophy}</div>
      <p class="eyebrow" style="margin:10px 0 0">Urkunde</p>
      <h2 id="cert-title" tabindex="-1">KI clever nutzen</h2>
      <p class="who" id="cert-name">${esc(state.name) || "&nbsp;"}</p>
      <p class="what">hat Runde 1 geschafft${extra}.</p>
      <div class="cert-badges">${badges}</div>
      <p class="date">${esc(date)}</p>
    </section>
    <p class="note">Zeig diesen Bildschirm deiner Lehrperson.</p>
    ${r2 === r2n ? "" : `<div style="text-align:center;margin-top:14px"><button class="btn ghost" type="button" id="to-bonus">${r2 ? "Runde 2 weiterspielen" : "Runde 2 starten"} ${ICONS.arrow}</button></div>`}`;
  $("name").addEventListener("input", (e) => {
    state.name = e.target.value.slice(0, 40);
    save();
    $("cert-name").innerHTML = esc(state.name.trim()) || "&nbsp;";
  });
  $("stage").querySelectorAll("[data-card]").forEach((b) => b.addEventListener("click", () => openCardView(LEVELS.find((l) => l.id === Number(b.dataset.card)), false)));
  const tb = $("to-bonus");
  if (tb) tb.addEventListener("click", () => go(firstOpen(2).id, true));
}

/* ---------- Modal & Inventar ---------- */
let lastFocus = null;
function openModal(html) {
  if ($("modal").hidden) lastFocus = document.activeElement;
  const sheet = $("sheet");
  sheet.innerHTML = html;
  sheet.scrollTop = 0;
  attachCard(sheet);
  $("modal").hidden = false;
  document.body.classList.add("modal-open");
  sheet.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
    closeModal();
    const t = b.dataset.go;
    go(t === "abschluss" ? "abschluss" : Number(t), true);
  }));
  const first = sheet.querySelector("button, input");
  if (first) first.focus({ preventScroll: true });
}
function closeModal() {
  $("modal").hidden = true;
  document.body.classList.remove("modal-open");
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function openInventory() {
  const s1 = inRound(1).map((l, i) => miniCard(l, i)).join("");
  const s2 = r1Complete()
    ? `<div class="minis" style="--cols:4">${inRound(2).map((l, i) => miniCard(l, i)).join("")}</div>`
    : `<p class="series-locked">${ICONS.lock} Wird freigeschaltet, wenn du Runde 1 geschafft hast.</p>`;
  openModal(`
    <div style="color:var(--gold);width:48px;height:48px;margin:0 auto">${ICONS.medal}</div>
    <h3 id="sheet-title">Deine Abzeichen</h3>
    <p style="margin-bottom:0">${state.done.length ? "Tippe auf eine Karte, um sie anzusehen." : "Löse Levels und sammle Karten."}</p>
    <p class="series-title">Serie 1 <span>${doneIn(1)}/${CORE}</span></p>
    <div class="minis" style="--cols:4">${s1}</div>
    <p class="series-title s2">Serie 2 <span>${doneIn(2)}/${inRound(2).length}</span></p>
    ${s2}
    <button class="btn" type="button" id="close-inv">Schliessen</button>
    <button class="reset" type="button" id="reset">Fortschritt löschen</button>`);
  $("close-inv").addEventListener("click", closeModal);
  $("sheet").querySelectorAll("[data-card]").forEach((b) => b.addEventListener("click", () => openCardView(LEVELS.find((l) => l.id === Number(b.dataset.card)), true)));
  const r = $("reset");
  r.addEventListener("click", () => {
    if (!r.classList.contains("armed")) { r.classList.add("armed"); r.textContent = "Wirklich alles löschen? Nochmals tippen."; return; }
    state = { done: [], best: {}, name: "" };
    save();
    closeModal();
    updateInventory();
    go(1, true);
    toast("Fortschritt gelöscht.");
  });
}
const closable = () => $("sheet").querySelector("#close-inv, #card-back");
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal" && closable()) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden && closable()) closeModal(); });
$("inv-btn").addEventListener("click", openInventory);

/* ---------- Start ---------- */
$("hero-icon").innerHTML = ICONS.robot;
$("inv-icon").outerHTML = ICONS.medal;
updateInventory();
(function init() {
  const h = location.hash;
  let target = null;
  if (h === "#abschluss" && unlocked("abschluss")) target = "abschluss";
  const m = h.match(/^#level-(\d+)$/);
  if (m && unlocked(Number(m[1]))) target = Number(m[1]);
  if (target === null) {
    target = r1Complete() ? "abschluss" : firstOpen(1).id;
  }
  go(target, false);
})();
</script>
</body>
</html>
